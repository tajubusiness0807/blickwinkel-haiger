<dialog class="lightbox" data-lightbox aria-label="Bildansicht">
  <figure class="lightbox__figure">
    <img class="lightbox__img" src="data:," alt="" data-lightbox-img>
    <figcaption class="lightbox__caption" data-lightbox-caption></figcaption>
  </figure>
  <button class="lightbox__btn lightbox__btn--prev" type="button" data-lightbox-prev aria-label="Vorheriges Bild"><svg class="i"><use href="#i-chevron-left"/></svg></button>
  <button class="lightbox__btn lightbox__btn--next" type="button" data-lightbox-next aria-label="Nächstes Bild"><svg class="i"><use href="#i-chevron-right"/></svg></button>
  <button class="lightbox__btn lightbox__btn--close" type="button" data-lightbox-close aria-label="Schließen"><svg class="i"><use href="#i-close"/></svg></button>
</dialog>
