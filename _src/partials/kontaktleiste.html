<section class="section section--tight">
  <div class="container">
    <div class="contact-strip" data-reveal>
      <div>
        <h2 class="contact-strip__title">Fragen oder Terminwunsch?</h2>
        <p class="status-line" data-status-line><span class="status-pill__dot" aria-hidden="true"></span><span data-status-text>Öffnungszeiten</span></p>
      </div>
      <div class="btn-row">
        <button class="btn btn--blue" type="button" data-termin><svg class="i"><use href="#i-calendar"/></svg>Termin anfragen</button>
        <a class="btn btn--ghost" href="tel:{{site.phoneHref}}"><svg class="i"><use href="#i-phone"/></svg>{{site.phone}}</a>
      </div>
    </div>
  </div>
</section>
