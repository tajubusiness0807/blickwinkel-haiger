<section class="section section--tight">
  <div class="container">
    <div class="cta-band" data-reveal="zoom">
      <div class="cta-band__eye" aria-hidden="true">{{> logo}}</div>
      <div>
        <h2 class="cta-band__title">Wir beraten Sie gerne. <em>Jetzt Wunschtermin vereinbaren!</em></h2>
        <p>Nehmen Sie sich Zeit für gutes Sehen – wir nehmen sie uns auch. Ganz ohne Zeitdruck, ehrlich und individuell.</p>
      </div>
      <div class="btn-row">
        <button class="btn btn--blue" type="button" data-termin><svg class="i"><use href="#i-calendar"/></svg>Termin anfragen</button>
        <a class="btn btn--ghost" href="tel:{{site.phoneHref}}"><svg class="i"><use href="#i-phone"/></svg>{{site.phone}}</a>
      </div>
    </div>
  </div>
</section>
