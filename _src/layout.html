<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{page.title}}</title>
  <meta name="description" content="{{page.description}}">
  <meta name="robots" content="{{page.robots}}">
  <link rel="canonical" href="{{page.canonical}}">
  <meta name="theme-color" content="#0b1f4d">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="de_DE">
  <meta property="og:site_name" content="{{site.fullName}}">
  <meta property="og:title" content="{{page.title}}">
  <meta property="og:description" content="{{page.description}}">
  <meta property="og:url" content="{{page.canonical}}">
  <meta property="og:image" content="{{site.url}}/assets/img/og-image.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/fraunces-opsz.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <script>document.documentElement.classList.add('js');try{if(sessionStorage.getItem('bw-intro'))document.documentElement.classList.add('intro-seen');else sessionStorage.setItem('bw-intro','1')}catch(e){document.documentElement.classList.add('intro-seen')}</script>
  <script src="assets/js/main.js" defer></script>
{{page.extraHead}}
</head>
<body class="{{page.bodyClass}}">
{{> header}}
<main id="inhalt" tabindex="-1">
{{page.content}}
</main>
{{> footer}}
{{> mobilebar}}
{{> termin}}
{{> lightbox}}
</body>
</html>
